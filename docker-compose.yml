services:
  ollama:
    image: ollama/ollama:latest
    container_name: mini-onyx-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: mini-onyx-backend
    ports:
      - "8000:8000"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      CHROMA_PERSIST_DIR: /app/chroma_db
    volumes:
      - rag-store:/app/chroma_db
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      # /health answers 200 even when Ollama is unreachable, reporting that
      # separately, so this only goes unhealthy if the API itself is down.
      test:
        ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  ollama-models:
  rag-store:
